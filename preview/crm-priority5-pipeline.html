<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM اولویت ۵ | Lead و Pipeline</title>
<style>
:root{--nav:#0b2239;--nav2:#123552;--p:#0f766e;--p2:#ccfbf1;--bg:#f3f6f9;--card:#fff;--ink:#172033;--muted:#6b7a90;--line:#dfe7ef;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--shadow:0 12px 35px #0b223912}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Tahoma,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:24px 16px;color:#fff;background:linear-gradient(160deg,var(--nav),#071827)}.brand{display:flex;align-items:center;gap:11px;margin-bottom:30px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#14b8a6,var(--p));font-size:22px;font-weight:900}.brand span{display:grid}.brand small{color:#ffffff9c}.nav{display:grid;gap:7px}.nav button{display:flex;gap:10px;width:100%;padding:11px 13px;color:#ffffffa8;border:0;border-radius:10px;background:transparent;text-align:right}.nav button.active{color:#fff;background:#ffffff13}.scope{position:absolute;right:16px;bottom:20px;left:16px;padding:12px;border:1px solid #ffffff16;border-radius:11px;background:#ffffff09}.scope small{display:block;color:#ffffff88}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;height:68px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--card)}.top b{color:var(--p)}.top span{color:var(--muted)}main{padding:27px}.head{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:25px}.head p{margin:3px 0;color:var(--muted)}.actions{display:flex;gap:8px}.btn{padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.btn.primary{color:#fff;border-color:var(--p);background:var(--p)}.btn.soft{color:var(--p);border:0;background:#ecfdf5}.btn.tiny{padding:5px 9px;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.kpi{padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}.kpi small{display:block;color:var(--muted)}.kpi strong{font-size:21px}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;gap:9px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.toolbar input{flex:1;min-width:180px}.field,input,select,textarea{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);background:#f8fafc;font-size:12px}td small{display:block;color:var(--muted)}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:11px}.badge.ok{color:var(--ok);background:#d1fae5}.badge.warn{color:var(--warn);background:#fef3c7}.badge.bad{color:var(--bad);background:#fee2e2}.score{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--p2);color:var(--p);font-weight:800}.board{display:grid;grid-template-columns:repeat(6,minmax(235px,1fr));gap:10px;overflow:auto;padding-bottom:10px}.col{min-height:470px;padding:9px;border:1px solid var(--line);border-radius:13px;background:#eef3f7}.col h3{margin:5px 5px 12px;font-size:13px}.col h3 small{display:block;color:var(--muted);font-weight:400}.card{margin-bottom:9px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.card .row{display:flex;justify-content:space-between;gap:8px}.card h4{margin:8px 0 2px;font-size:13px}.card p{margin:0 0 9px;color:var(--muted);font-size:11px}.card strong{display:block}.meta{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.empty{padding:35px 8px;color:var(--muted);border:1px dashed #cbd5e1;border-radius:10px;text-align:center}.drawerBg{position:fixed;inset:0;z-index:10;visibility:hidden;background:#07182788;opacity:0;transition:.2s}.drawerBg.open{visibility:visible;opacity:1}.drawer{position:fixed;z-index:11;top:0;bottom:0;left:0;width:min(520px,94vw);padding:22px;overflow:auto;background:#fff;transform:translateX(-105%);transition:.25s}.drawer.open{transform:none}.drawerHead{display:flex;justify-content:space-between;align-items:center}.drawer form{display:grid;gap:12px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid label{display:grid;gap:5px}.grid .full{grid-column:1/-1}.note{padding:10px;border-radius:9px;background:#f0fdfa;color:#115e59;font-size:12px}.toast{position:fixed;z-index:20;bottom:22px;right:22px;padding:11px 15px;color:#fff;border-radius:10px;background:#064e3b;box-shadow:var(--shadow)}[hidden]{display:none!important}@media(max-width:800px){.shell{display:block}.side{position:static;height:auto}.scope{display:none}.nav{grid-template-columns:1fr 1fr}.main main{padding:16px}.kpis{grid-template-columns:1fr 1fr}.top{padding:0 16px}.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><span class="logo">آ</span><span><b>ارقام CRM</b><small>نمونهٔ اولویت ۵</small></span></div><nav class="nav"><button class="active" data-page="leads">◎ مدیریت سرنخ‌ها</button><button data-page="pipeline">◫ فرصت‌های فروش</button></nav><div class="scope"><small>محیط کاری</small><b>شرکت تولیدی ارقام</b><small>همه شعب · C01</small></div></aside><section class="main"><header class="top"><b>Lead & Opportunity Governance</b><span>مهدی نادری · مدیر فروش</span></header><main id="view"></main></section></div>
<div class="drawerBg" id="drawerBg"></div><aside class="drawer" id="drawer"><div class="drawerHead"><div><small id="drawerEyebrow">فرم آزمایشی</small><h2 id="drawerTitle">ثبت</h2></div><button class="btn" id="close">بستن</button></div><div id="drawerBody"></div></aside><div id="toast" class="toast" hidden></div>
<script>
const stages=["شناسایی","کشف","تأیید","ارائه راهکار","مذاکره","تعهد"], probs=[10,25,45,60,75,90];
const state={page:"leads",leads:[
 {id:1,code:"LD-1405-118",name:"پایدار انرژی خاور",contact:"سامان رستگار",source:"نمایشگاه",owner:"سارا احمدی",score:86,status:"واجد شرایط",sla:"انجام‌شده",next:"جلسه معرفی راهکار",due:"فردا ۱۰:۰۰"},
 {id:2,code:"LD-1405-117",name:"تجارت نوین پارس",contact:"علی محرابی",source:"وب‌سایت",owner:"مهدی نادری",score:71,status:"تخصیص‌یافته",sla:"گذشته",next:"تماس اولیه",due:"امروز ۱۴:۰۰"},
 {id:3,code:"LD-1405-116",name:"راهکاران صنعت شرق",contact:"شیوا رستمی",source:"معرفی مشتری",owner:"نرگس یوسفی",score:63,status:"تماس‌شده",sla:"انجام‌شده",next:"ارسال مطالعه موردی",due:"فردا ۱۲:۰۰"},
 {id:4,code:"LD-1405-115",name:"پخش باران غرب",contact:"حامد رضوانی",source:"کمپین",owner:"محمد رضایی",score:44,status:"تخصیص‌یافته",sla:"نزدیک",next:"تکمیل اطلاعات",due:"امروز ۱۶:۰۰"}],opps:[
 {id:11,code:"OP-2041",title:"تأمین سالانه مواد اولیه سپهر",customer:"صنایع غذایی سپهر",value:14800000000,owner:"سارا احمدی",stage:"ارائه راهکار",risk:"کم",next:"دموی فنی"},
 {id:12,code:"OP-2040",title:"قرارداد توزیع منطقه مرکز",customer:"گروه تولیدی آریا",value:9200000000,owner:"محمد رضایی",stage:"مذاکره",risk:"متوسط",next:"بازبینی قرارداد"},
 {id:13,code:"OP-2039",title:"فروش ویژه فصل پاییز",customer:"بازرگانی نخل جنوب",value:4100000000,owner:"مهدی نادری",stage:"تعهد",risk:"زیاد",next:"تصمیم نهایی"},
 {id:14,code:"OP-2038",title:"توسعه سبد کالای ماهان",customer:"فروشگاه زنجیره‌ای ماهان",value:6750000000,owner:"نرگس یوسفی",stage:"کشف",risk:"متوسط",next:"جلسه نیازسنجی"}]};
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat("fa-IR",{maximumFractionDigits:0}).format(n)+" ریال", fa=n=>new Intl.NumberFormat("fa-IR").format(n);
function badge(text){const c=text==="گذشته"||text==="زیاد"?"bad":text==="نزدیک"||text==="متوسط"?"warn":text==="واجد شرایط"||text==="انجام‌شده"||text==="کم"?"ok":"";return `<span class="badge ${c}">${text}</span>`}
function header(k,t,d,a){return `<section class="head"><div><small>${k}</small><h1>${t}</h1><p>${d}</p></div><div class="actions">${a}</div></section>`}
function renderLeads(){const avg=Math.round(state.leads.reduce((s,x)=>s+x.score,0)/state.leads.length);return header("Lead Management · اولویت ۵","مدیریت سرنخ‌ها","مالکیت، SLA تماس، امتیاز و تبدیل کنترل‌شده",`<button class="btn primary" data-action="newLead">+ سرنخ جدید</button>`)+`<section class="kpis"><article class="kpi"><small>سرنخ باز</small><strong>${fa(state.leads.length)}</strong></article><article class="kpi"><small>واجد شرایط</small><strong>${fa(state.leads.filter(x=>x.status==="واجد شرایط").length)}</strong></article><article class="kpi"><small>SLA گذشته</small><strong>${fa(state.leads.filter(x=>x.sla==="گذشته").length)}</strong></article><article class="kpi"><small>میانگین امتیاز</small><strong>${fa(avg)}</strong></article></section><section class="panel"><div class="toolbar"><input id="leadSearch" placeholder="جست‌وجوی نام، کد یا تماس"><span>Scope و Ownership در سرویس اعمال می‌شود</span></div><div style="overflow:auto"><table><thead><tr><th>سرنخ</th><th>منبع/مالک</th><th>امتیاز</th><th>وضعیت</th><th>SLA</th><th>اقدام بعدی</th><th></th></tr></thead><tbody>${state.leads.map(x=>`<tr><td><b>${x.name}</b><small>${x.code} · ${x.contact}</small></td><td>${x.source}<small>${x.owner}</small></td><td><span class="score">${fa(x.score)}</span></td><td>${badge(x.status)}</td><td>${badge(x.sla)}</td><td>${x.next}<small>${x.due}</small></td><td><button class="btn tiny ${x.status==="واجد شرایط"?"primary":"soft"}" data-action="leadStep" data-id="${x.id}">${x.status==="واجد شرایط"?"تبدیل":"ثبت پیگیری"}</button></td></tr>`).join("")}</tbody></table></div></section>`}
function renderPipeline(){const total=state.opps.reduce((s,x)=>s+x.value,0),weighted=state.opps.reduce((s,x)=>s+x.value*probs[stages.indexOf(x.stage)]/100,0);return header("Sales Pipeline · اولویت ۵","فرصت‌های فروش","ارزش وزنی، ریسک، Next Action و تاریخچه مرحله",`<button class="btn primary" data-action="newOpp">+ فرصت جدید</button>`)+`<section class="kpis"><article class="kpi"><small>ارزش کل</small><strong>${money(total)}</strong></article><article class="kpi"><small>ارزش وزنی</small><strong>${money(weighted)}</strong></article><article class="kpi"><small>فرصت باز</small><strong>${fa(state.opps.length)}</strong></article><article class="kpi"><small>پرریسک</small><strong>${fa(state.opps.filter(x=>x.risk==="زیاد").length)}</strong></article></section><section class="board">${stages.map((s,i)=>{const items=state.opps.filter(x=>x.stage===s);return `<article class="col"><h3>${s}<small>${fa(items.length)} فرصت · ${money(items.reduce((a,x)=>a+x.value,0))}</small></h3>${items.map(x=>`<div class="card"><div class="row"><code>${x.code}</code>${badge(probs[i]+"٪")}</div><h4>${x.title}</h4><p>${x.customer} · ${x.owner}</p><strong>${money(x.value)}</strong><div class="meta"><span>${badge(x.risk)}</span><span>بعدی: ${x.next}</span></div><button class="btn tiny soft" style="width:100%;margin-top:9px" data-action="oppStep" data-id="${x.id}" ${i===5?"disabled":""}>${i===5?"آماده تصمیم نهایی":"انتقال به "+stages[i+1]}</button></div>`).join("")||`<div class="empty">فرصتی نیست</div>`}</article>`}).join("")}</section>`}
function render(){document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===state.page));$("#view").innerHTML=state.page==="leads"?renderLeads():renderPipeline()}
function open(type){$("#drawer").classList.add("open");$("#drawerBg").classList.add("open");if(type==="lead"){$("#drawerTitle").textContent="سرنخ جدید";$("#drawerEyebrow").textContent="Lead + SLA";$("#drawerBody").innerHTML=`<form data-form="lead"><div class="grid"><label class="full">نام سرنخ *<input name="name" required></label><label>شخص تماس *<input name="contact" required></label><label>تلفن<input name="phone"></label><label>منبع<select name="source"><option>وب‌سایت</option><option>نمایشگاه</option><option>معرفی مشتری</option></select></label><label>مالک<select name="owner"><option>مهدی نادری</option><option>سارا احمدی</option><option>نرگس یوسفی</option></select></label></div><div class="note">SLA تماس اولیه به‌طور نمونه چهار ساعت پس از ثبت آغاز می‌شود.</div><button class="btn primary">ثبت و تخصیص</button></form>`}else{$("#drawerTitle").textContent="فرصت جدید";$("#drawerEyebrow").textContent="Opportunity";$("#drawerBody").innerHTML=`<form data-form="opp"><div class="grid"><label class="full">عنوان *<input name="title" required></label><label>مشتری *<input name="customer" required></label><label>ارزش (ریال) *<input name="value" type="number" min="1" value="2500000000" required></label><label>مالک<select name="owner"><option>مهدی نادری</option><option>سارا احمدی</option></select></label><label>ریسک<select name="risk"><option>کم</option><option selected>متوسط</option><option>زیاد</option></select></label><label class="full">اقدام بعدی *<input name="next" value="جلسه کشف نیاز" required></label></div><div class="note">فرصت در مرحله شناسایی با احتمال ۱۰٪ ایجاد می‌شود.</div><button class="btn primary">ایجاد فرصت</button></form>`}}
function close(){$("#drawer").classList.remove("open");$("#drawerBg").classList.remove("open")}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2500)}
document.addEventListener("click",e=>{const p=e.target.closest("[data-page]");if(p){state.page=p.dataset.page;render();return}const b=e.target.closest("[data-action]");if(!b)return;const id=Number(b.dataset.id);if(b.dataset.action==="newLead")open("lead");if(b.dataset.action==="newOpp")open("opp");if(b.dataset.action==="leadStep"){const x=state.leads.find(x=>x.id===id);if(x.status==="تخصیص‌یافته"){x.status="تماس‌شده";x.sla="انجام‌شده";x.next="جلسه کشف نیاز";toast("تماس و اقدام بعدی ثبت شد") }else if(x.status==="تماس‌شده"){x.status="واجد شرایط";x.score=Math.max(75,x.score);toast("سرنخ واجد شرایط شد")}else{state.leads=state.leads.filter(y=>y.id!==id);state.opps.push({id:Date.now(),code:"OP-NEW",title:"فرصت همکاری با "+x.name,customer:x.name,value:2500000000,owner:x.owner,stage:"شناسایی",risk:"متوسط",next:"جلسه کشف نیاز"});state.page="pipeline";toast("مشتری و فرصت با Lineage ایجاد شد")}render()}if(b.dataset.action==="oppStep"){const x=state.opps.find(x=>x.id===id),i=stages.indexOf(x.stage);if(i<5){x.stage=stages[i+1];toast("مرحله و تاریخچه فرصت ثبت شد");render()}}});
document.addEventListener("submit",e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(e.target.dataset.form==="lead")state.leads.unshift({id:Date.now(),code:"LD-NEW",name:d.name,contact:d.contact,source:d.source,owner:d.owner,score:70,status:"تخصیص‌یافته",sla:"در مهلت",next:"تماس اولیه",due:"چهار ساعت آینده"});else state.opps.unshift({id:Date.now(),code:"OP-NEW",title:d.title,customer:d.customer,value:Number(d.value),owner:d.owner,stage:"شناسایی",risk:d.risk,next:d.next});close();render();toast("اطلاعات نمونه ثبت شد")});
$("#close").onclick=close;$("#drawerBg").onclick=close;render();
</script>
</body></html>
